<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="glow"></div>
    <div class="hill h1"></div>
    <div class="hill h2"></div>
    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>
  </div>

  <main class="app">
    <div class="card">
      <h1 class="title">Weather App</h1>
      <form class="search" id="search-form">
        <input type="text" id="city-input" placeholder="Type a city name..." aria-label="City name" autocomplete="off">
        <button type="submit">Search</button>
      </form>

      <p class="message" id="message" role="status" hidden></p>

      <div class="result" id="result" hidden>
        <div class="city" id="city"></div>
        <div class="time" id="time"></div>
        <div class="now">
          <img class="icon" id="icon" alt="" width="64" height="64">
          <div class="temp" id="temp"></div>
        </div>
        <div class="desc" id="desc"></div>
        <div class="details">
          <div><span>Feels like</span><b id="feels"></b></div>
          <div><span>Humidity</span><b id="humidity"></b></div>
          <div><span>Wind</span><b id="wind"></b></div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
